name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Se eliminó cache: 'npm' para evitar el error del lockfile

      - name: Instalar dependencias
        # Se cambió 'npm ci' a 'npm install'
        run: npm install

      - name: Compilar PWA (Vite Build)
        run: npm run build
        env:
          # Si configuraste este secreto en Settings > Secrets and variables > Actions
          VITE_SHEETS_API_URL: ${{ secrets.VITE_SHEETS_API_URL }}

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
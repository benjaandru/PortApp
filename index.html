<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport adaptado para iPhone con soporte de safe-area-inset y prevención de zoom molesto en inputs -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <title>Finanzas Personales & Portfolio</title>
    <meta name="description" content="PWA de finanzas personales, gestión de gastos y portfolio con ajuste por inflación" />

    <!-- META TAGS CRÍTICOS PARA iOS PWA (Full-Screen nativo sin barra de Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <!-- Iconos PWA y Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- Colores de tema y barras de estado -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-navbutton-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google Fonts: Inter para tipografía moderna y nítida -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" 
      rel="stylesheet" 
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
